name: Publish images

# Builds the production api + web images and pushes them to Docker Hub as
# ahmedshamimhassan/pulsedeck-api and ahmedshamimhassan/pulsedeck-web. Triggered
# by a version tag (v1.0.0); also runnable on demand to rebuild :latest.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — Docker Hub account with push access to the repos above
#   DOCKERHUB_TOKEN     — a Docker Hub access token (not the password)
on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual rebuild of :latest from the default branch

# One publish run per tag; a newer tag push supersedes an in-flight one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7

      # QEMU + buildx give us a single multi-arch (amd64 + arm64) manifest —
      # arm64 matters for Apple Silicon and Graviton/ARM Kubernetes nodes.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives the tag set: full semver (1.2.3), major.minor (1.2), and `latest`
      # only on the default branch, from the pushed git tag.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/ahmedshamimhassan/pulsedeck-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache keyed per image so api/web don't collide.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
