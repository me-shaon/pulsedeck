services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://pulsedeck:pulsedeck@postgres:5432/pulsedeck
      # Change this to a long random value (>=32 chars) before any real use.
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-long-random-secret-string}
      # Report retention: 0 = keep forever (default). Set >0 to purge reports
      # older than N days; the sweep is single-run across replicas (advisory lock).
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-3600000}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy # wait for DB readiness, not just container start
      # redis intentionally NOT required to boot

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-3000}:80'
    # nginx proxies /api → the api service (see apps/web/nginx.conf). Start the
    # api first so the upstream name resolves; the proxy 502s until it's ready.
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pulsedeck
      POSTGRES_PASSWORD: pulsedeck
      POSTGRES_DB: pulsedeck
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulsedeck']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ['realtime']

volumes:
  postgres_data:
