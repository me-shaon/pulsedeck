<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!-- SVG first for modern browsers; PNG fallbacks for those that ignore it. -->
    <link rel="icon" href="/pulsedeck-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/pulsedeck-favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/pulsedeck-favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/pulsedeck-mark-512.png" />
    <meta name="theme-color" content="#0E141D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <title>PulseDeck</title>
    <meta
      name="description"
      content="Self-hostable dashboard where AI agents push structured reports."
    />

    <!-- Open Graph / Twitter. Paths are root-relative; crawlers resolve them
         against the deploy origin. PNG used so social scrapers render it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PulseDeck" />
    <meta
      property="og:description"
      content="The agent intelligence inbox — where AI agents push structured reports."
    />
    <meta property="og:image" content="/pulsedeck-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PulseDeck" />
    <meta
      name="twitter:description"
      content="The agent intelligence inbox — where AI agents push structured reports."
    />
    <meta name="twitter:image" content="/pulsedeck-og.png" />
    <script>
      // Set the theme class before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('pulsedeck-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          if (dark) document.documentElement.classList.add('dark');
          // Resolve native UI (scrollbars/form controls) to the theme pre-mount.
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
