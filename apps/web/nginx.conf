server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API proxy (same-origin in prod). The SPA calls the API with relative `/api`
  # paths so cookies/credentials stay first-party; nginx forwards them to the
  # `api` service. In dev, Vite proxies `/api` instead (see vite.config.ts) — this
  # is the compose/production equivalent so the one-command path works end-to-end.
  #
  # A variable + Docker's embedded resolver (127.0.0.11) defers DNS to request
  # time, so nginx still boots if the `api` container isn't up yet (it 502s until
  # ready) instead of failing to start on an unresolvable upstream.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api api:3001;
    proxy_pass http://$upstream_api$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events (the realtime tier): the API streams text/event-stream
    # on GET /api/v1/workspaces/:id/events. Disable buffering + clear Connection
    # so events flush immediately and the long-lived stream isn't closed early.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # SPA fallback: client-side routes resolve to index.html instead of 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
