name: Publish images

# Builds the production api + web images and pushes them to Docker Hub as
# ahmedshamimhassan/pulsedeck-api and ahmedshamimhassan/pulsedeck-web. Triggered
# by a version tag (v1.0.0); also runnable on demand to rebuild :latest.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  — Docker Hub account with push access to the repos above
#   DOCKERHUB_TOKEN     — a Docker Hub access token (not the password)
on:
  push:
    tags: ['v*']
  workflow_dispatch: # manual rebuild of :latest from the default branch

# One publish run per tag; a newer tag push supersedes an in-flight one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx give us a single multi-arch (amd64 + arm64) manifest —
      # arm64 matters for Apple Silicon and Graviton/ARM Kubernetes nodes.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives the tag set: full semver (1.2.3), major.minor (1.2), and `latest`
      # only on the default branch, from the pushed git tag.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: docker.io/ahmedshamimhassan/pulsedeck-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache keyed per image so api/web don't collide.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
