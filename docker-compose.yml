# Production stack. `docker compose up -d` builds and runs the full app; the API
# applies migrations on startup, so a fresh deploy comes up ready.
#
# For hot-reloading development, overlay docker-compose.dev.yml (see Makefile /
# README): docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: pulsedeck/api:latest
    restart: unless-stopped
    environment:
      # Production posture: the API rejects known placeholder secrets when this
      # is `production` (see apps/api/src/env.ts).
      NODE_ENV: production
      # Built from POSTGRES_PASSWORD so the DB password lives in exactly one place
      # (.env) and is never hardcoded. To use an EXTERNAL/managed Postgres instead,
      # override this whole value via the DATABASE_URL env var.
      DATABASE_URL: ${DATABASE_URL:-postgres://pulsedeck:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run `make setup` or set a strong DB password}@postgres:5432/pulsedeck}
      # Session/token signing secret. NO default on purpose — boot aborts if it is
      # unset so a deployment can never run on a known value. Provide it via .env
      # (compose auto-loads it): run `make setup` to generate one, or set it to
      # `openssl rand -base64 48`. To rotate: replace the value and restart the API.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — run `make setup` or set a 32+ char random value (openssl rand -base64 48)}
      # Public origin the browser uses to reach the app. better-auth builds OAuth
      # callbacks + validates request origins against this, so it MUST be the
      # public web origin (nginx, WEB_PORT) — not the API's internal port.
      # Defaults to the local web origin; if you change WEB_PORT or front this
      # with a domain/HTTPS, set BETTER_AUTH_URL=https://your.domain accordingly.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Trust the bundled nginx as one proxy hop so `request.ip` is the real
      # client (needed for the IP-keyed auth/ingest rate limits and real client
      # IPs in logs). Increase if you add another LB/proxy in front.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Optional: point the rate limiters (and SSE fan-out) at Redis so limits
      # hold ACROSS replicas. Unset → per-node in-memory limiting. Start Redis
      # with `--profile realtime` and set e.g. redis://redis:6379.
      REDIS_URL: ${REDIS_URL:-}
      # Report retention: 0 = keep forever (default). Set >0 to purge reports
      # older than N days; the sweep is single-run across replicas (advisory lock).
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-3600000}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy # wait for DB readiness, not just container start
      # redis intentionally NOT required to boot
    healthcheck:
      # /healthz = liveness + DB reachability. busybox wget ships in node:alpine.
      # Use 127.0.0.1, not localhost: busybox resolves localhost to ::1 first and
      # the server binds IPv4 only, so localhost would wrongly fail.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # grace for install-free boot + startup migrations

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: pulsedeck/web:latest
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:80'
    # nginx proxies /api → the api service (see apps/web/nginx.conf). Start the
    # api first so the upstream name resolves; the proxy 502s until it's ready.
    depends_on:
      - api
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsedeck
      # No default — must be provided via .env (run `make setup`). Same value the
      # api's DATABASE_URL is built from above, so the secret lives in one place.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run `make setup` or set a strong DB password}
      POSTGRES_DB: pulsedeck
    # Not published to the host in production: the api reaches Postgres over the
    # internal compose network. The dev overlay re-publishes it on 127.0.0.1 for
    # local tooling (psql / a GUI). Exposing 5432 to all interfaces with a known
    # password was the original risk (security finding C2).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulsedeck']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ['realtime']

volumes:
  postgres_data:
